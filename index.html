<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matíz - Generador de paletas</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <main class="app">

    <h1 class="app__title">
      Matíz
    </h1>

    <p class="app__subtitle">
        Descubre una nueva combinación de colores
    </p>

    <section class="palette">
      <!-- JavaScript añadirá aquí los colores -->
    </section>

    <button class="generate-button">
      Generar nueva paleta
    </button>

    <p class="copy-message"></p>

  </main>

  <script src="./main.js"></script>
</body>
</html>
